name: Moonlight Duo TestFlight

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check the Xcode archive or sign and upload an internal build
        type: choice
        options: [preflight, upload]
        default: preflight

permissions:
  contents: read

concurrency:
  group: moonlight-duo-testflight
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  preflight:
    if: github.repository == 'AntonVantra/moonlight-ios-duo' && github.ref == 'refs/heads/duo-desktop' && inputs.mode == 'preflight'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check available Apple signing and upload tooling
        run: |
          bash -n BuildScripts/sign-testflight.sh
          python3 -c 'import ast, pathlib; ast.parse(pathlib.Path("BuildScripts/upload-testflight.py").read_text())'
          xcodebuild -version
          xcodebuild -help > "$RUNNER_TEMP/xcodebuild-help.txt" 2>&1
          grep -A 4 'testFlightInternalTestingOnly' "$RUNNER_TEMP/xcodebuild-help.txt"

      - name: Verify the unsigned Xcode archive
        run: |
          archive="$RUNNER_TEMP/MoonlightDuo.xcarchive"
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight \
            -configuration Release -destination 'generic/platform=iOS' -archivePath "$archive" \
            -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO archive
          app="$archive/Products/Applications/Moonlight.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist" | grep -Fx com.antonvantra.moonlight.duo
          test -f "$app/Moonlight"

  upload:
    if: github.repository == 'AntonVantra/moonlight-ios-duo' && github.ref == 'refs/heads/duo-desktop' && inputs.mode == 'upload'
    runs-on: xcode-27
    timeout-minutes: 25
    environment: moonlight-testflight
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Sign Moonlight Duo and upload to internal TestFlight
        env:
          MOONLIGHT_CERTIFICATE: ${{ secrets.MOONLIGHT_CERTIFICATE }}
          MOONLIGHT_CERTIFICATE_PASSWORD: ${{ secrets.MOONLIGHT_CERTIFICATE_PASSWORD }}
          MOONLIGHT_PROFILE: ${{ secrets.MOONLIGHT_PROFILE }}
          MOONLIGHT_UPLOAD_KEY_ID: ${{ secrets.MOONLIGHT_UPLOAD_KEY_ID }}
          MOONLIGHT_UPLOAD_PRIVATE_KEY: ${{ secrets.MOONLIGHT_UPLOAD_PRIVATE_KEY }}
        run: bash BuildScripts/sign-testflight.sh
